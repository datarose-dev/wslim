[package]
name = "wslim"
version = "2026.10.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Safe, filtered, restorable WSL backups for Windows"
repository = "https://github.com/datarose-dev/wslim"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lzma-rust2 = "0.20.1"
flate2 = "1.1"
clap = { version = "4.6", features = ["derive"] }
inquire = "0.9.4"
indicatif = "0.18.6"
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
